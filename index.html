<!--
  CABINET — v1.0
  Appli de gestion pour psychologue en libéral : patients, planning des rendez-vous, notes de séance,
  paiements et impayés, charges du cabinet (loyer, URSSAF, CIPAV…), tableau de bord, exports pour le comptable.

  Confidentialité (secret professionnel, données de santé) :
  · Les données ne quittent jamais l'appareil : aucun serveur, aucun compte, aucune synchronisation.
    La CSP n'autorise aucune connexion vers l'extérieur (connect-src 'self' : seulement les fichiers de l'appli).
  · Elles sont chiffrées (AES-GCM 256) avant d'être écrites dans le navigateur. La clé de données est aléatoire ;
    elle est elle-même chiffrée deux fois : par le code (PBKDF2-SHA-256) et par la clé de secours.
    Sans l'un des deux, rien n'est lisible — ni dans le téléphone, ni dans une sauvegarde.
  · Verrouillage automatique après quelques minutes sans activité ou en quittant l'appli ; mode discret (initiales).

  iPhone : à ajouter à l'écran d'accueil (Safari → Partager → Sur l'écran d'accueil). Safari efface les données d'un
  site non ouvert depuis 7 jours, mais pas celles d'une appli ajoutée à l'écran d'accueil.

  Un seul fichier, aucune bibliothèque externe. Après toute modification du script : recalculer les empreintes de la CSP
  avec l'outil des tests (rangés à part), sinon la page ne démarre pas.
-->

/* ==========================================================================

   ========================================================================== */
:root{
  color-scheme: light;

  --trait:#d9d7d3; --trait-doux:#e7e5e1;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}

/* ==========================================================================

.barre{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--haut)) 16px 10px;background:color-mix(in srgb, var(--fond) 88%, transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--trait-doux)}

/* ==========================================================================
   3. CARTES, TITRES, LISTES

<script>
'use strict';
/* ==========================================================================
   A. DONNÉES — un seul objet DB, chiffré à chaque enregistrement
   ========================================================================== */
const VERSION = 1, APPLI = 'Cabinet', VERSION_APPLI = '1.0';
const STATUTS_PATIENT = [['actif', 'En suivi', 'vert'], ['attente', 'En attente', 'jaune'], ['termine', 'Suivi terminé', 'gris']];
const STATUTS_RDV = {prevu:['Prévu', 'bleu'], honore:['Honoré', 'vert'], absent:['Absent', 'rose'], annule:['Annulé', 'gris']};
const MODES = [['cb', 'Carte'], ['especes', 'Espèces'], ['cheque', 'Chèque'], ['virement', 'Virement'], ['autre', 'Autre']];
const CATEGORIES = [['loyer', 'Loyer du cabinet', 'bleu'], ['urssaf', 'URSSAF', 'orange'], ['cipav', 'CIPAV (retraite)', 'violet'], ['cfe', 'CFE et impôts', 'jaune'],
  ['assurance', 'Assurance RCP', 'vert'], ['prevoyance', 'Mutuelle et prévoyance', 'rose'], ['supervision', 'Supervision', 'violet'], ['formation', 'Formation', 'bleu'],
  ['materiel', 'Matériel et fournitures', 'gris'], ['logiciel', 'Logiciels et abonnements', 'gris'], ['telephone', 'Téléphone et internet', 'gris'],
  ['comptable', 'Comptable et AGA', 'jaune'], ['banque', 'Banque', 'gris'], ['deplacement', 'Déplacements', 'orange'], ['autre', 'Autre', 'gris']];
const LIEUX = ['Cabinet', 'Visio', 'Domicile', 'Téléphone'];
const REGLAGES = {
  praticien:'', profession:'Psychologue', adresse:'', telephone:'', email:'', adeli:'', siret:'',
  tarif:60, duree:50, debut:'08:00', fin:'20:00', jours:[1, 2, 3, 4, 5],
  absenceFacturee:true, provision:25, seuil:77700, rappelSauvegarde:7, derniereSauvegarde:'',
  verrou:5, discret:false,
  modeleRappel:'Bonjour {prenom}, je vous rappelle notre rendez-vous {jour} à {heure}. Bonne journée. {praticien}',
  modeleRelance:'Bonjour {prenom}, sauf erreur de ma part, {seances} reste à régler ({montant}). Merci, bonne journée. {praticien}'
};
const vierge = () => ({version:VERSION, reglages:{...REGLAGES}, patients:[], rdv:[], notes:[], charges:[], fixes:[], recettes:[]});
let DB = vierge();

const txt = v => typeof v === 'string' ? v.trim() : v == null ? '' : String(v).trim();
const nombre = (v, def = 0) => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : def; };
const dateValide = v => /^\d{4}-\d{2}-\d{2}$/.test(txt(v)) ? txt(v) : '';
const heureValide = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(txt(v)) ? txt(v) : '';
const unDe = (v, liste, def) => liste.includes(v) ? v : def;
/* Toute donnée lue (déchiffrée, restaurée, saisie) repasse par ici : formes sûres, valeurs bornées */
function normaliser(d){
  d = d && typeof d === 'object' ? d : {};
  const r = {...REGLAGES, ...(d.reglages || {})};
  r.tarif = nombre(r.tarif, 60); r.duree = Math.min(240, Math.max(10, Math.round(nombre(r.duree, 50))));
  r.debut = heureValide(r.debut) || '08:00'; r.fin = heureValide(r.fin) || '20:00';
  r.jours = Array.isArray(r.jours) ? r.jours.filter(j => Number.isInteger(j) && j >= 0 && j <= 6) : [1, 2, 3, 4, 5];
  r.provision = Math.min(80, Math.max(0, nombre(r.provision, 25))); r.seuil = Math.max(0, nombre(r.seuil, 77700));
  r.rappelSauvegarde = Math.min(90, Math.max(0, Math.round(nombre(r.rappelSauvegarde, 7))));
  r.verrou = [0, 1, 2, 5, 10, 15, 30].includes(r.verrou) ? r.verrou : 5; r.discret = !!r.discret; r.absenceFacturee = r.absenceFacturee !== false;
  ['praticien', 'profession', 'adresse', 'telephone', 'email', 'adeli', 'siret', 'modeleRappel', 'modeleRelance', 'derniereSauvegarde'].forEach(k => r[k] = txt(r[k]));
  const id = x => txt(x.id) || uid(), cree = x => txt(x.cree) || maintenant(), liste = k => Array.isArray(d[k]) ? d[k].filter(x => x && typeof x === 'object') : [];
  const patients = liste('patients').map(p => ({id:id(p), nom:txt(p.nom), prenom:txt(p.prenom), naissance:dateValide(p.naissance), telephone:txt(p.telephone), email:txt(p.email),
    adresse:txt(p.adresse), adressePar:txt(p.adressePar), medecin:txt(p.medecin), motif:txt(p.motif), statut:unDe(p.statut, ['actif', 'attente', 'termine'], 'actif'),
    debut:dateValide(p.debut), demande:dateValide(p.demande), tarif:p.tarif === '' || p.tarif == null ? null : nombre(p.tarif, null), duree:p.duree ? Math.round(nombre(p.duree, 0)) || null : null,
    infos:txt(p.infos), couleur:Math.abs(Math.round(nombre(p.couleur, 0))) % 6, demo:!!p.demo || undefined, cree:cree(p), modif:txt(p.modif) || cree(p)}));
  const rdv = liste('rdv').filter(x => dateValide(x.date) && heureValide(x.heure)).map(x => ({id:id(x), patient:txt(x.patient), titre:txt(x.titre), date:x.date, heure:x.heure,
    duree:Math.min(600, Math.max(5, Math.round(nombre(x.duree, 50)))), lieu:txt(x.lieu) || 'Cabinet', statut:unDe(x.statut, Object.keys(STATUTS_RDV), 'prevu'),
    facturer:x.facturer !== false, montant:nombre(x.montant, 0), regle:x.regle && typeof x.regle === 'object' && nombre(x.regle.montant, 0) > 0
      ? {date:dateValide(x.regle.date) || x.date, mode:unDe(x.regle.mode, MODES.map(m => m[0]), 'autre'), montant:nombre(x.regle.montant, 0)} : null,
    serie:txt(x.serie), note:txt(x.note), demo:!!x.demo || undefined, cree:cree(x), modif:txt(x.modif) || cree(x)}));
  const notes = liste('notes').map(n => ({id:id(n), patient:txt(n.patient), rdv:txt(n.rdv), date:dateValide(n.date) || aujourdhui(), texte:typeof n.texte === 'string' ? n.texte : '',
    demo:!!n.demo || undefined, cree:cree(n), modif:txt(n.modif) || cree(n)}));
  const charges = liste('charges').filter(c => dateValide(c.date)).map(c => ({id:id(c), date:c.date, libelle:txt(c.libelle), categorie:unDe(c.categorie, CATEGORIES.map(x => x[0]), 'autre'),
    montant:nombre(c.montant, 0), mode:unDe(c.mode, MODES.map(m => m[0]), 'virement'), fixe:txt(c.fixe), note:txt(c.note), demo:!!c.demo || undefined, cree:cree(c), modif:txt(c.modif) || cree(c)}));
  const fixes = liste('fixes').map(f => ({id:id(f), libelle:txt(f.libelle), categorie:unDe(f.categorie, CATEGORIES.map(x => x[0]), 'autre'), montant:nombre(f.montant, 0),
    jour:Math.min(28, Math.max(1, Math.round(nombre(f.jour, 5)))), mode:unDe(f.mode, MODES.map(m => m[0]), 'virement'), demo:!!f.demo || undefined}));
  const recettes = liste('recettes').filter(x => dateValide(x.date)).map(x => ({id:id(x), date:x.date, libelle:txt(x.libelle), montant:nombre(x.montant, 0),
    mode:unDe(x.mode, MODES.map(m => m[0]), 'virement'), demo:!!x.demo || undefined, cree:cree(x), modif:txt(x.modif) || cree(x)}));
  return {version:VERSION, reglages:r, patients, rdv, notes, charges, fixes, recettes};
}

/* ==========================================================================
   B. UTILITAIRES — dates à l'heure locale, formats, texte
   ========================================================================== */
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const maintenant = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const aujourdhui = () => iso(new Date());
function versDate(s){ if(!s) return null; if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [a, m, j] = s.split('-').map(Number); return new Date(a, m - 1, j); } const d = new Date(s); return isNaN(d) ? null : d; }
const decale = (j, n) => { const d = versDate(j); d.setDate(d.getDate() + n); return iso(d); };
const lundiDe = j => { const d = versDate(j); return decale(j, -((d.getDay() + 6) % 7)); };
const moisDe = j => j.slice(0, 7);
const joursDansMois = ym => { const [a, m] = ym.split('-').map(Number); return new Date(a, m, 0).getDate(); };
const decaleMois = (ym, n) => { const [a, m] = ym.split('-').map(Number); const d = new Date(a, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const minutes = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const versHeure = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const finRdv = r => versHeure(minutes(r.heure) + r.duree);
const heureMaintenant = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const majuscule = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const F = {
  long:new Intl.DateTimeFormat('fr-FR', {weekday:'long', day:'numeric', month:'long'}),
  longAn:new Intl.DateTimeFormat('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}),
  moyen:new Intl.DateTimeFormat('fr-FR', {day:'numeric', month:'long', year:'numeric'}),
  court:new Intl.DateTimeFormat('fr-FR', {day:'numeric', month:'short'}),
  courtAn:new Intl.DateTimeFormat('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}),
  jourSem:new Intl.DateTimeFormat('fr-FR', {weekday:'short'}),
  mois:new Intl.DateTimeFormat('fr-FR', {month:'long', year:'numeric'}),
  moisCourt:new Intl.DateTimeFormat('fr-FR', {month:'short'}),
  eur:new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR'}),
  eur0:new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits:0})
};
const dateLongue = j => majuscule(F.long.format(versDate(j)));
const dateLongueAn = j => majuscule(F.longAn.format(versDate(j)));
const dateMoyenne = j => F.moyen.format(versDate(j));
const dateCourte = j => F.court.format(versDate(j));
const dateChiffres = j => F.courtAn.format(versDate(j));
const nomMois = ym => majuscule(F.mois.format(versDate(ym + '-01')));
const eur = n => F.eur.format(n || 0);
const eurRond = n => Math.abs(n) >= 1000 ? F.eur0.format(n || 0) : F.eur.format(n || 0);
const pluriel = (n, mot, pl) => n + ' ' + (n > 1 ? (pl || mot + 's') : mot);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const somme = l => Math.round(l.reduce((a, x) => a + (Number(typeof x === 'number' ? x : x.montant) || 0), 0) * 100) / 100;
const ilYA = j => { const n = Math.round((versDate(aujourdhui()) - versDate(j)) / 864e5); return n <= 0 ? 'aujourd’hui' : n === 1 ? 'hier' : n < 31 ? 'il y a ' + n + ' jours' : 'le ' + dateCourte(j); };
const estIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const installee = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ==========================================================================
   C. COFFRE — chiffrement (Web Crypto) et stockage (IndexedDB)
   La clé de données (aléatoire, 256 bits) chiffre DB. Elle est enveloppée deux fois : par une clé dérivée du code
   (PBKDF2-SHA-256) et par une clé dérivée de la clé de secours. Le code n'est jamais enregistré.
   ========================================================================== */
const ITERATIONS = 310000, enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => { const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const deB64 = s => { const t = atob(String(s || '')); const u = new Uint8Array(t.length); for(let i = 0; i < t.length; i++) u[i] = t.charCodeAt(i); return u; };
async function deriver(secret, sel, iter = ITERATIONS){
  const base = await crypto.subtle.importKey('raw', enc.encode(String(secret).normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:sel, iterations:iter}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function chiffrer(cle, octets){ const iv = crypto.getRandomValues(new Uint8Array(12)); return {iv:b64(iv), ct:b64(await crypto.subtle.encrypt({name:'AES-GCM', iv}, cle, octets))}; }
async function dechiffrer(cle, boite){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:deB64(boite.iv)}, cle, deB64(boite.ct))); }
const importerCle = brut => crypto.subtle.importKey('raw', brut, {name:'AES-GCM'}, false, ['encrypt', 'decrypt']);
/* Clé de secours : 24 caractères sans ambiguïté (pas de 0/O, 1/I/L), groupés par 4 — environ 119 bits */
const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function nouvelleCleSecours(){ const v = crypto.getRandomValues(new Uint8Array(24)); let s = ''; for(const x of v) s += ALPHABET[x % ALPHABET.length]; return s.match(/.{4}/g).join('-'); }
const normSecours = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

/* IndexedDB : une base « cabinet », un magasin, une seule entrée « coffre » */
let baseIDB = null;
function ouvrirIDB(){
  if(baseIDB) return Promise.resolve(baseIDB);
  return new Promise((ok, ko) => {
    let r; try { r = indexedDB.open('cabinet', 1); } catch(e){ return ko(e); }
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { baseIDB = r.result; baseIDB.onversionchange = () => { baseIDB.close(); baseIDB = null; }; ok(baseIDB); };
    r.onerror = () => ko(r.error); r.onblocked = () => ko(new Error('base bloquée par un autre onglet'));
  });
}
const idb = (mode, f) => ouvrirIDB().then(b => new Promise((ok, ko) => { const t = b.transaction('kv', mode), s = t.objectStore('kv'); const q = f(s); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); }));
const lireCoffre = () => idb('readonly', s => s.get('coffre'));
const ecrireCoffre = c => idb('readwrite', s => s.put(c, 'coffre'));
const effacerCoffre = () => idb('readwrite', s => s.delete('coffre'));

let cleDonnees = null, coffre = null;   /* en mémoire seulement pendant que l'appli est déverrouillée */
const verifCoffre = c => c && c.app === 'cabinet' && c.v === 1 && c.sel && c.cle && c.cle.code && c.cle.secours && c.donnees && c.donnees.iv && c.donnees.ct;
async function creerCoffre(code, secours, donnees){
  const brut = crypto.getRandomValues(new Uint8Array(32)), selCode = crypto.getRandomValues(new Uint8Array(16)), selSec = crypto.getRandomValues(new Uint8Array(16));
  const c = {app:'cabinet', v:1, iter:ITERATIONS, sel:{code:b64(selCode), secours:b64(selSec)},
    cle:{code:await chiffrer(await deriver(code, selCode), brut), secours:await chiffrer(await deriver(normSecours(secours), selSec), brut)}};
  cleDonnees = await importerCle(brut); brut.fill(0);
  c.donnees = await chiffrer(cleDonnees, enc.encode(JSON.stringify(donnees))); c.maj = maintenant();
  await ecrireCoffre(c); coffre = c; return c;
}
/* Ouvre un coffre avec le code (ou la clé de secours) ; renvoie les données, ou null si le secret est faux */
async function ouvrirCoffre(c, secret, parSecours = false){
  let brut;
  try { brut = await dechiffrer(await deriver(parSecours ? normSecours(secret) : secret, deB64(parSecours ? c.sel.secours : c.sel.code), c.iter || ITERATIONS), parSecours ? c.cle.secours : c.cle.code); }
  catch(e){ return null; }
  const cle = await importerCle(brut);
  const donnees = JSON.parse(dec.decode(await dechiffrer(cle, c.donnees)));
  return {cle, brut, donnees};
}
/* Nouveau code : seule l'enveloppe « code » change (la clé de données et la clé de secours restent) */
async function changerCode(brut, nouveau){
  const sel = crypto.getRandomValues(new Uint8Array(16));
  coffre.sel.code = b64(sel); coffre.cle.code = await chiffrer(await deriver(nouveau, sel, coffre.iter || ITERATIONS), brut);
  await ecrireCoffre(coffre);
}
async function changerSecours(brut, nouvelle){
  const sel = crypto.getRandomValues(new Uint8Array(16));
  coffre.sel.secours = b64(sel); coffre.cle.secours = await chiffrer(await deriver(normSecours(nouvelle), sel, coffre.iter || ITERATIONS), brut);
  await ecrireCoffre(coffre);
}

/* Enregistrement : chiffré puis écrit, regroupé (300 ms), forcé quand l'appli passe en arrière-plan */
let minuterieSauver = 0, enCoursSauver = null, aSauver = false;
function sauver(){ aSauver = true; clearTimeout(minuterieSauver); minuterieSauver = setTimeout(ecrireMaintenant, 300); }
async function ecrireMaintenant(){
  clearTimeout(minuterieSauver);
  if(!aSauver || !cleDonnees || !coffre) return;
  if(enCoursSauver){ await enCoursSauver; if(!aSauver) return; }
  aSauver = false;
  enCoursSauver = (async () => {
    try { coffre.donnees = await chiffrer(cleDonnees, enc.encode(JSON.stringify(DB))); coffre.maj = maintenant(); await ecrireCoffre(coffre); }
    catch(e){ aSauver = true; toast('Enregistrement impossible : ' + (e && e.message || e)); }
  })();
  await enCoursSauver; enCoursSauver = null;
}

   E. CALCULS — séances, dû, réglé, impayés, encaissements
   ========================================================================== */
const unPatient = id => DB.patients.find(p => p.id === id) || null;
const unRdv = id => DB.rdv.find(r => r.id === id) || null;
const nomComplet = p => p ? [p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom' : 'Patient supprimé';
const initiales = p => p ? ((p.prenom || '').charAt(0) + (p.nom || '').charAt(0)).toUpperCase() || '?' : '?';
/* Mode discret : initiales seulement (« C. M. »), partout où un nom apparaît à l'écran */
const nomAff = p => !p ? 'Patient supprimé' : DB.reglages.discret ? [p.prenom, p.nom].filter(Boolean).map(x => x.charAt(0).toUpperCase() + '.').join(' ') || '?' : nomComplet(p);
const titreRdv = r => r.patient ? nomAff(unPatient(r.patient)) : (r.titre || 'Créneau bloqué');
const tarifDe = p => p && p.tarif != null ? p.tarif : DB.reglages.tarif;
const dureeDe = p => p && p.duree ? p.duree : DB.reglages.duree;
const couleurPatient = p => COULEURS_AV[(p && p.couleur) || 0];
/* Une séance est due si elle a eu lieu, ou si le patient est absent sans prévenir (et que l'absence est facturée) */
const facturable = r => !!r.patient && (r.statut === 'honore' || (r.statut === 'absent' && r.facturer));
const du = r => facturable(r) ? r.montant : 0;
const regleDe = r => r.regle ? r.regle.montant : 0;
const reste = r => Math.max(0, Math.round((du(r) - regleDe(r)) * 100) / 100);
const passe = r => r.date < aujourdhui() || (r.date === aujourdhui() && finRdv(r) <= heureMaintenant());
const parDate = (a, b) => (a.date + a.heure).localeCompare(b.date + b.heure);
const impayes = () => DB.rdv.filter(r => r.date <= aujourdhui() && reste(r) > 0).sort(parDate);
const totalImpayes = () => somme(impayes().map(reste));
const aPointer = () => DB.rdv.filter(r => r.statut === 'prevu' && r.patient && passe(r)).sort(parDate);
const rdvDu = j => DB.rdv.filter(r => r.date === j).sort(parDate);
const actifs = r => r.statut !== 'annule';
const prochains = pid => { const auj = aujourdhui(), h = heureMaintenant(); return DB.rdv.filter(r => r.patient === pid && r.statut === 'prevu' && (r.date > auj || (r.date === auj && finRdv(r) > h))).sort(parDate); };
const seancesDe = pid => DB.rdv.filter(r => r.patient === pid).sort(parDate).reverse();
const notesDe = pid => DB.notes.filter(n => n.patient === pid).sort((a, b) => (b.date + b.cree).localeCompare(a.date + a.cree));
const noteDuRdv = rid => DB.notes.find(n => n.rdv === rid) || null;
/* Encaissements d'une période (date d'encaissement) : séances réglées + autres recettes */
function encaissements(debut, fin){
  const l = DB.rdv.filter(r => r.regle && r.regle.date >= debut && r.regle.date <= fin)
    .map(r => ({date:r.regle.date, montant:r.regle.montant, mode:r.regle.mode, patient:r.patient, libelle:'Séance du ' + dateChiffres(r.date), rdv:r.id}));
  DB.recettes.filter(x => x.date >= debut && x.date <= fin).forEach(x => l.push({date:x.date, montant:x.montant, mode:x.mode, patient:'', libelle:x.libelle || 'Autre recette', recette:x.id}));
  return l.sort((a, b) => a.date.localeCompare(b.date));
}
const chargesEntre = (debut, fin) => DB.charges.filter(c => c.date >= debut && c.date <= fin).sort((a, b) => b.date.localeCompare(a.date));
const chevauchements = r => DB.rdv.filter(x => x.id !== r.id && x.date === r.date && actifs(x) && minutes(x.heure) < minutes(r.heure) + r.duree && minutes(r.heure) < minutes(x.heure) + x.duree);
/* Charges fixes du mois : saisies (une charge porte leur identifiant ce mois-là) ou pas encore */
const fixeSaisie = (f, ym) => DB.charges.some(c => c.fixe === f.id && moisDe(c.date) === ym);
const fixesASaisir = ym => DB.fixes.filter(f => !fixeSaisie(f, ym) && (ym < moisDe(aujourdhui()) || f.jour <= versDate(aujourdhui()).getDate()));
const nomCategorie = k => (CATEGORIES.find(c => c[0] === k) || CATEGORIES[CATEGORIES.length - 1])[1];
const couleurCategorie = k => (CATEGORIES.find(c => c[0] === k) || CATEGORIES[CATEGORIES.length - 1])[2];
const nomMode = k => (MODES.find(m => m[0] === k) || ['', 'Autre'])[1];
const sauvegardeEnRetard = () => { const r = DB.reglages; if(!r.rappelSauvegarde) return false; if(!r.derniereSauvegarde) return DB.patients.length > 0;
  return (Date.now() - new Date(r.derniereSauvegarde).getTime()) / 864e5 >= r.rappelSauvegarde; };
/* Remplit un modèle de message : {prenom}, {jour}, {heure}, {praticien}, {seances}, {montant} */
const modele = (t, v) => String(t || '').replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
const lienSms = (tel, corps) => { const n = String(tel || '').replace(/[^\d+]/g, ''); return 'sms:' + n + (corps ? (estIOS() ? '&' : '?') + 'body=' + encodeURIComponent(corps) : ''); };
const lienTel = tel => 'tel:' + String(tel || '').replace(/[^\d+]/g, '');
const lienMail = (mail, sujet, corps) => 'mailto:' + encodeURIComponent(mail || '') + '?subject=' + encodeURIComponent(sujet || '') + '&body=' + encodeURIComponent(corps || '');
const jourRelatif = j => j === aujourdhui() ? 'aujourd’hui' : j === decale(aujourdhui(), 1) ? 'demain' : 'le ' + F.long.format(versDate(j));

/* ==========================================================================
   F. BRIQUES D'AFFICHAGE
   ========================================================================== */
const btn = (action, texte, cls = 'btn', attrs = '') => `<button type="button" class="${cls}" data-action="${action}" ${attrs}>${texte}</button>`;
const puce = (texte, couleur = 'gris') => `<span class="puce ${couleur}">${texte}</span>`;
const puceStatut = r => r.patient ? puce(STATUTS_RDV[r.statut][0], STATUTS_RDV[r.statut][1]) : '';
function pucePaiement(r){
  if(!facturable(r)) return r.regle ? puce('Réglé ' + eur(r.regle.montant), 'vert') : '';
  const rs = reste(r);
  if(!rs) return puce('Réglé · ' + nomMode(r.regle.mode), 'vert');
  if(r.date > aujourdhui()) return '';
  return puce(r.regle ? 'Reste ' + eur(rs) : 'À régler ' + eur(rs), 'orange');
}
const avatar = p => `<span class="avatar" style="--c:${couleurPatient(p)}" aria-hidden="true">${esc(initiales(p))}</span>`;
const vide = (texte, boutons = '') => `<div class="vide">${texte}${boutons ? `<div class="boutons">${boutons}</div>` : ''}</div>`;
function carteRdv(r, {actions = false, date = false, titreDate = false} = {}){
  const p = unPatient(r.patient), bloque = !r.patient, maint = r.date === aujourdhui() && r.heure <= heureMaintenant() && finRdv(r) > heureMaintenant() && r.statut !== 'annule';
  const c = bloque ? 'var(--gris)' : `var(--${STATUTS_RDV[r.statut][1]})`;
  const meta = [date && !titreDate ? dateCourte(r.date) : '', bloque ? '' : esc(r.lieu), bloque ? esc(r.lieu !== 'Cabinet' ? r.lieu : '') : puceStatut(r), bloque ? '' : pucePaiement(r),
    !bloque && r.statut === 'honore' && !noteDuRdv(r.id) && r.date >= decale(aujourdhui(), -7) ? `<span class="faible">sans note</span>` : '', r.serie ? ico('repeter', 13) : ''].filter(Boolean).join(' ');
  let act = '';
  if(actions && !bloque){

/* --- Formulaire générique ---
   champs : {n, l, t:'texte'|'tel'|'email'|'date'|'heure'|'nombre'|'montant'|'select'|'zone'|'case'|'mdp'|'html', v, o:[{v,t}], aide, demi, requis, attrs}
   onOk(valeurs) : renvoie un message d'erreur (la feuille reste ouverte) ou rien */
function champHtml(c){
  const id = 'ch-' + c.n, v = c.v ?? '', aide = c.aide ? ` <em>— ${esc(c.aide)}</em>` : '', at = c.attrs || '';
  if(c.t === 'html') return c.html;
  if(c.t === 'case') return `<label class="case-ligne"><input type="checkbox" name="${c.n}" id="${id}"${v ? ' checked' : ''} ${at}><span>${esc(c.l)}${c.aide ? `<br><span class="faible" style="font-size:13px">${esc(c.aide)}</span>` : ''}</span></label>`;
  const entree = c.t === 'select' ? `<select name="${c.n}" id="${id}" ${at}>${c.o.map(o => `<option value="${esc(o.v)}"${String(o.v) === String(v) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`
    : c.t === 'zone' ? `<textarea name="${c.n}" id="${id}" rows="${c.lignes || 5}" ${at}>${esc(v)}</textarea>`
    : `<input name="${c.n}" id="${id}" value="${esc(v)}" ${{texte:'type="text"', tel:'type="tel" autocomplete="off"', email:'type="email" autocomplete="off" autocapitalize="off"', date:'type="date"', heure:'type="time" step="300"',
      nombre:'type="text" inputmode="numeric"', montant:'type="text" inputmode="decimal"', mdp:'type="password" autocomplete="off" autocapitalize="off" spellcheck="false"'}[c.t || 'texte'] || 'type="text"'} ${c.requis ? 'required' : ''} ${at}>`;
  return `<label class="champ" for="${id}"><span>${esc(c.l)}${aide}</span>${entree}</label>`;
}
function champsHtml(champs){
  let h = '', i = 0;
  while(i < champs.length){
    const c = champs[i];
    if(c.demi && champs[i + 1] && champs[i + 1].demi){ h += `<div class="deux">${champHtml(c)}${champHtml(champs[i + 1])}</div>`; i += 2; }
    else { h += champHtml(c); i++; }
  }
  return h;
}
function lireForm(f){
  const v = {};
  $$('input,select,textarea', f).forEach(el => { if(!el.name) return; v[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  return v;
}
function formulaire({titre, champs, ok = 'Enregistrer', onOk, avant = '', apresChamps = '', suppr = null, apres = null, fermeture = null}){
  const corps = `<form id="form-feuille" novalidate>${avant}${champsHtml(champs)}${apresChamps}<p class="message-erreur" id="form-erreur" role="alert" hidden></p><button type="submit" hidden></button></form>`;

/* Message en bas de l'écran ; « Annuler » rétablit ce qui vient d'être supprimé */

}

    <div class="segment" role="group" aria-label="Affichage">${seg('jour', 'Jour')}${seg('semaine', 'Semaine')}</div></div>`;
  if(planVue === 'jour'){
    html += `<div class="semaine-bande">${jours.map(j => { const n = rdvDu(j).filter(r => actifs(r)).length, d = versDate(j);
      return `<button type="button" class="${j === planJour ? 'on' : ''}${j === auj ? ' auj' : ''}" data-action="plan-jour" data-j="${j}" aria-label="${esc(dateLongue(j))}${n ? ', ' + pluriel(n, 'rendez-vous', 'rendez-vous') : ''}" aria-pressed="${j === planJour}">

const optionsPatients = sel => [{v:'', t:'— Choisir —'}, ...trierPatients(DB.patients.filter(p => p.statut !== 'termine' || p.id === sel)).map(p => ({v:p.id, t:nomAff(p)})), {v:'__nouveau', t:'+ Nouveau patient…'}];
function formRdv(r0 = {}, {bloque = false} = {}){

/* --- Exports CSV (point-virgule, UTF-8 avec BOM : s'ouvre directement dans Excel) --- */
const cellule = v => { const s = typeof v === 'number' ? String(v.toFixed(2)).replace('.', ',') : String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csv = lignes => '﻿' + lignes.map(l => l.map(cellule).join(';')).join('\r\n') + '\r\n';
async function partagerFichier(nom, contenu, type){
  const fichier = new File([contenu], nom, {type});
  if(navigator.canShare && navigator.share && estIOS()){
    try { if(navigator.canShare({files:[fichier]})){ await navigator.share({files:[fichier], title:nom}); return true; } }
    catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(fichier), a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}

/* --- Sauvegarde et restauration (le coffre tel quel : déjà chiffré) --- */
async function sauvegarder(){
  await ecrireMaintenant();
  const contenu = JSON.stringify({app:coffre.app, v:coffre.v, iter:coffre.iter, sel:coffre.sel, cle:coffre.cle, donnees:coffre.donnees, maj:coffre.maj, sauvegarde:maintenant(),
    lisezmoi:'Sauvegarde chiffrée de Cabinet. Illisible sans le code ou la clé de secours en vigueur au moment de la sauvegarde. Pour la restaurer : Cabinet → Réglages → Restaurer.'}, null, 1);
  const d = new Date(), nom = 'cabinet-sauvegarde-' + aujourdhui() + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  const ok = await partagerFichier(nom, contenu, 'application/json');
  if(ok){ DB.reglages.derniereSauvegarde = maintenant(); sauver(); rendre(); toast('Sauvegarde prête : rangez-la hors du téléphone'); }
}
function restaurer(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    let c = null; try { c = JSON.parse(await f.text()); } catch(e){ c = null; }
    if(!verifCoffre(c)) return toast('Ce fichier n’est pas une sauvegarde de Cabinet.');
    c = {app:c.app, v:c.v, iter:c.iter, sel:c.sel, cle:c.cle, donnees:c.donnees, maj:c.maj};
    formulaire({titre:'Restaurer une sauvegarde', ok:'Ouvrir la sauvegarde', avant:`<p class="aide">Sauvegarde du ${esc(c.maj ? dateMoyenne(c.maj.slice(0, 10)) : '?')}. Saisissez le code en vigueur à ce moment-là, ou la clé de secours.</p>`,
      champs:[{n:'secret', l:'Code ou clé de secours', t:'mdp', attrs:'autofocus'}, {n:'parSecours', l:'C’est la clé de secours', t:'case'}],
      onOk:async v => {
        const r = await ouvrirCoffre(c, v.secret, !!v.parSecours); if(!r) return v.parSecours ? 'Clé de secours incorrecte.' : 'Code incorrect pour cette sauvegarde.';
        const d = normaliser(r.donnees);
        if(etat === 'ouvert' && !(await confirmer({titre:'Remplacer les données ?', texte:`Les données actuelles (${pluriel(DB.patients.length, 'patient')}) seront remplacées par celles de la sauvegarde (${pluriel(d.patients.length, 'patient')}). Pensez à sauvegarder d’abord les données actuelles si besoin.`, ok:'Remplacer', danger:true}))){ r.brut.fill(0); return; }
        fermer(true);
        await ecrireCoffre(c); coffre = c; cleDonnees = r.cle; DB = d;
        if(v.parSecours) return nouveauCodeApresSecours(r.brut);
        r.brut.fill(0); demanderPersistance(); ouvrirAppli(); toast('Sauvegarde restaurée');
      }});
  };
  inp.click();
}

/* --- Exemples : patients et séances inventés, pour découvrir l'appli ; retirés d'un geste --- */
function remplirExemples(){
  let graine = 42; const alea = () => (graine = (graine * 16807) % 2147483647) / 2147483647, choix = l => l[Math.floor(alea() * l.length)];

  DB.patients.push({id:uid(), prenom:'Hugo', nom:'Garnier', statut:'attente', demande:decale(auj, -10), motif:'Anxiété avant les examens', telephone:'06 00 00 00 30', couleur:0, demo:true, cree:maintenant(), modif:maintenant()});

  const fixes = [['Loyer du cabinet', 'loyer', 650, 5, 'virement'], ['Supervision', 'supervision', 80, 15, 'virement'], ['Téléphone et internet', 'telephone', 30, 10, 'cb']].map(([libelle, categorie, montant, jour, mode]) => ({id:uid(), libelle, categorie, montant, jour, mode, demo:true}));

function retirerExemples(){
  const fixesEx = new Set(DB.fixes.filter(f => f.demo).map(f => f.id));   /* une charge saisie depuis une charge fixe d'exemple part avec elle */
  ['patients', 'rdv', 'notes', 'charges', 'fixes', 'recettes'].forEach(k => { DB[k] = DB[k].filter(x => !x.demo && !(k === 'charges' && fixesEx.has(x.fixe))); });
  const restent = new Set(DB.patients.map(p => p.id));   /* séances et notes ajoutées ensuite à un patient d'exemple : parties avec lui */
  DB.rdv = DB.rdv.filter(r => !r.patient || restent.has(r.patient)); DB.notes = DB.notes.filter(n => restent.has(n.patient));
}

/* Prochaine heure ronde libre du jour (ou le début de journée) */
function prochaineHeure(j){
  const r = DB.reglages; let t = minutes(r.debut);
  if(j === aujourdhui()) t = Math.max(t, Math.ceil((minutes(heureMaintenant()) + 1) / 15) * 15);
  const libres = creneauxLibres(j).filter(([a, b]) => b > t); if(libres.length) t = Math.max(t, libres[0][0]);
  return versHeure(Math.min(t, 23 * 60 + 45));
}

  f(el, e);
});

document.addEventListener('submit', e => {

  if(f.id === 'f-code'){ e.preventDefault(); const v = lireForm(f), pb = verifNouveauCode(v.code, v.code2), er = $('#err');
    if(pb){ er.textContent = pb; er.hidden = false; return; } assistant.code = v.code; accueil(3); }
  else if(f.id === 'f-cab'){ e.preventDefault(); terminerAccueil(f); }
  else if(f.id === 'f-verrou'){ e.preventDefault(); deverrouiller(f, !!$('[name="secret"]:not([type="password"])', f)); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && feuilleOuverte()){ e.preventDefault(); fermer(); } });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', majCouleurBarre);

/* ==========================================================================
   K. DÉMARRAGE
   ========================================================================== */
async function demarrer(){
  majCouleurBarre();
  if(!window.crypto || !crypto.subtle) return ecran(`${logo()}<h1>Cabinet</h1><p class="sous">Ce navigateur ne permet pas le chiffrement des données (page non sécurisée ?). Ouvrez Cabinet depuis son adresse https://.</p>`);
  let c;
  try { c = await lireCoffre(); }
  catch(e){ return ecran(`${logo()}<h1>Cabinet</h1><p class="sous">Le stockage de ce navigateur est indisponible (navigation privée ?). Ouvrez Cabinet normalement, ou depuis l’écran d’accueil.</p><p class="faible" style="text-align:center;font-size:13px">${esc(e && e.message || e)}</p>`); }
  if(verifCoffre(c)){ coffre = c; ecranVerrou(); } else accueil(1);
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
demarrer();
</script>
